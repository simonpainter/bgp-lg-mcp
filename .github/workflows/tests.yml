name: Tests

on:
  pull_request:
    branches:
      - main

jobs:
  pytest:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: |
          set +e
          python -m pytest
          status=$?
          # TODO: Remove exit-code-5 handling once repository test files are added.
          if [ "$status" -eq 5 ]; then
            echo "No tests were collected."
            exit 0
          fi
          exit "$status"
